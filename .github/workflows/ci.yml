name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # CI builds in local-demo mode: all providers run as deterministic
          # stubs, no secrets required. Real providers promote at runtime when
          # their keys are present in the deployment environment.
          FRAMEWORK_MODE: local
